  svgEl("path", { class: "ph", d: "M-4.6 -4.2c.6-.6 1.5-.6 2 0l1.2 1.4c.4.5.4 1.2 0 1.6l-.7.7c.5 1.2 1.4 2.2 2.6 2.7l.7-.7c.4-.4 1.1-.4 1.6 0l1.4 1.2c.6.5.6 1.4 0 2l-.8.8c-.8.8-2.1 1-3.1.4C-.6 4.4-3.3 1.8-4.9-1.1c-.6-1-.4-2.3.4-3.1z" }, token);

  return { svg, pos, nodes, edges, drawEdge, token, gLit, gChips, chips, addChip };
}

// Chips size to their text; the width is only known once the board is in the page and fonts settle.
function sizeChip(c) {
  let w = c.text.length * 9.4 + 20;
  try { const m = c.tx.getComputedTextLength(); if (m > 0) w = m + 22; } catch {}
  c.rect.setAttribute("x", c.cx - w / 2);
  c.rect.setAttribute("width", w);
}

// Shrink any label that would overflow its node (long stage names, fallback fonts).
function fitLabels() {
  for (const n of Object.values(board.nodes)) {
    n.lbl.removeAttribute("textLength"); n.lbl.removeAttribute("lengthAdjust");
    const max = n.p.w - 18;
    try { if (n.lbl.getComputedTextLength() > max) { n.lbl.setAttribute("textLength", max); n.lbl.setAttribute("lengthAdjust", "spacingAndGlyphs"); } } catch {}
  }
  board.chips.forEach(sizeChip);
}

function resetBoard() {
  for (const [id, e] of Object.entries(board.edges)) {
    if (e.temp) { e.poly.remove(); delete board.edges[id]; continue; }
    e.poly.classList.remove("lit");
    e.poly.setAttribute("marker-end", "url(#arr)");
  }
  for (const n of Object.values(board.nodes)) {
    n.g.classList.remove("visited", "current", "final");
    n.markEl?.remove(); n.markEl = null; n.mark = null;
    n.tm.textContent = "";
  }
  paintEndChip(null);
  board.token.setAttribute("opacity", 0);
}

// The edge into Lost is labelled only when the hearts ran out. A move to Lost with hearts left was the
// bot's call, and the banner says so; the edge stays unlabelled.
function paintEndChip(s) {
  const key = s && s.outcome === "lost" && s.livesLeft === 0 ? `${s.callId}:${s.traveled.at(-1)}` : null;
  if (board.endChip?.key === key) return;
  if (board.endChip) { board.endChip.g.remove(); board.chips.splice(board.chips.indexOf(board.endChip), 1); board.endChip = null; }
  const e = key && board.edges[s.traveled.at(-1)];
  if (!e) return;
  board.endChip = board.addChip(`out of hearts (${FLOW.OBJECTION_LIMIT})`, pointAlong(e.pts, 0.5), board.gChips, "chip-end");
  board.endChip.key = key;
}

function lightEdge(id) {
  let e = board.edges[id];
  if (!e) {
    const [from, to] = id.split(">");
    if (!board.pos[from] || !board.pos[to]) return null;
    e = board.drawEdge(from, to, true);
  }
  e.poly.classList.add("lit");
  e.poly.setAttribute("marker-end", "url(#arr-lit)");
  board.gLit.appendChild(e.poly);
  return e;
}

let animId = 0;
const restPoint = (stage) => { const p = board.pos[stage]; return [p.x + 4, p.y + 4]; };
function animateAlong(e, done) {
  const my = ++animId;
  const { pts } = e;
  const segs = pts.slice(1).map((p, i) => Math.hypot(p[0] - pts[i][0], p[1] - pts[i][1]));
  const total = segs.reduce((a, b) => a + b, 0);
  const dur = Math.min(1400, 350 + total * 1.2);
  const t0 = performance.now();
  board.token.setAttribute("opacity", 1);
  (function frame(now) {
    if (my !== animId) return;
    const p = Math.min(1, (now - t0) / dur);
    const ease = 1 - Math.pow(1 - p, 3);
    let dist = ease * total, i = 0;
    while (i < segs.length - 1 && dist > segs[i]) dist -= segs[i++];
    const f = segs[i] ? dist / segs[i] : 1;
    board.token.setAttribute("transform", `translate(${pts[i][0] + (pts[i + 1][0] - pts[i][0]) * f},${pts[i][1] + (pts[i + 1][1] - pts[i][1]) * f})`);
    if (p < 1) requestAnimationFrame(frame); else done();
  })(t0);
}

// Corner marker per node: check when cleared forward, red X or slate stop on a reached exit, and a
// lock (gold when its facts are in) on a gate ahead. A loop stage shows its visit count in the node.
function markFor(s, id, visited, cleared) {
  const st = ST(id), live = !isTerm(s);
  if (st.lane === "exit") return visited.has(id) ? (BAD_END.has(id) ? "x" : "end") : null;
  if (id === s.stage && live) return null;
  if (visited.has(id) && selfLoop(id)) return null;
  if (cleared.has(id) || (id === s.stage && st.terminal === "won")) return "check";
  if (!visited.has(id) && board.nodes[id].gated) return !gateOpen(s, id) ? "lock" : gateReqs(id).some((k) => reqState(s, k) === "unk") ? "weak" : "open";
  return null;
}

function drawMark(n, mark) {
  const x = n.p.x + n.p.w - 4, y = n.p.y + 4;
  const g = svgEl("g", { transform: `translate(${x},${y})` }, n.g);
  if (mark === "check") { g.setAttribute("class", "mk-check"); svgEl("circle", { r: 10 }, g); svgEl("path", { d: "M-4.5 0.5 l3 3 l6 -6.5" }, g); }
  else if (mark === "x") { g.setAttribute("class", "mk-x"); svgEl("circle", { r: 10 }, g); svgEl("path", { d: "M-3.8 -3.8 L3.8 3.8 M3.8 -3.8 L-3.8 3.8" }, g); }
  else if (mark === "end") { g.setAttribute("class", "mk-end"); svgEl("circle", { r: 10 }, g); svgEl("rect", { x: -3.6, y: -3.6, width: 7.2, height: 7.2, rx: 1.2 }, g); }
  else if (mark === "lock" || mark === "open" || mark === "weak") {
    const opened = mark !== "lock";
    g.setAttribute("class", "mk-lock" + (opened ? ` open ${mark}` : ""));
    svgEl("circle", { r: 10.5 }, g);
    svgEl("path", { d: "M-4.5 -0.5 h9 v6 h-9 z" + (opened ? " M-2.6 -0.5 v-2.8 a2.6 2.6 0 0 1 5 -1" : " M-2.6 -0.5 v-2.8 a2.6 2.6 0 0 1 5.2 0 v2.8") }, g);
    svgEl("title", {}, g).textContent = { open: "Gate open: its required facts are in", weak: "Gate open on a placeholder answer, not a real value", lock: "Gate locked: required facts missing" }[mark];
  }
  return g;
}

function paintNodeTimes(s) {
  const times = stageTimes(s);
  const visited = new Set(s.trail.map((t) => t.stage));
  for (const [id, n] of Object.entries(board.nodes)) {
    const ms = times[id] ?? 0;
    const visits = selfLoop(id) ? s.trail.filter((t) => t.stage === id).length : 0;
    const parts = [visits > 1 ? `×${visits}` : "", visited.has(id) && !ST(id).terminal && ms >= 1000 ? mmss(ms) : ""].filter(Boolean);
    const text = parts.join(" · ");
    if (n.tm.textContent !== text) n.tm.textContent = text;
    n.lbl.setAttribute("y", text ? n.p.cy - 3 : n.p.cy + 7);
    n.tm.setAttribute("y", n.p.cy + 19);
  }
}

function paintBoard(s, animate) {
  const visited = new Set(s.trail.map((t) => t.stage));
  const cleared = new Set(s.traveled.map((e) => e.split(">")).filter(([a, b]) => a !== b && FLOW.STAGES[b] && !isExit(b)).map(([a]) => a));
  const live = !isTerm(s);
  for (const [id, n] of Object.entries(board.nodes)) {
    n.g.classList.toggle("visited", visited.has(id));
    n.g.classList.toggle("current", id === s.stage && live);
    n.g.classList.toggle("final", id === s.stage && !live);
    const mark = markFor(s, id, visited, cleared);
    if (mark !== n.mark) { n.markEl?.remove(); n.markEl = mark ? drawMark(n, mark) : null; n.mark = mark; }
  }
  paintNodeTimes(s);
  for (const id of new Set(s.traveled)) lightEdge(id);
  paintEndChip(s);
  const lastId = s.traveled[s.traveled.length - 1];
  const rest = restPoint(s.stage);
  const place = () => { board.token.setAttribute("transform", `translate(${rest[0]},${rest[1]})`); board.token.setAttribute("opacity", 1); };
  if (animate && !reduceMotion() && s.trail.length === shown.trailLen + 1 && board.edges[lastId]) animateAlong(board.edges[lastId], place);
  else if (s.trail.length !== shown.trailLen || !animate) { animId++; place(); }
  shown.trailLen = s.trail.length;
}

/* ================= header HUD and celebrations ================= */
function paintHud(s) {
  const limit = FLOW.OBJECTION_LIMIT, lives = s?.livesLeft ?? limit;
  const hearts = $("hearts");
  hearts.replaceChildren();
  // With no call the hearts are dim outlines and the numbers are dashes: nothing to report yet.
  hearts.classList.toggle("idle", !s);
  for (let i = 0; i < limit; i++) {
    const broken = s && i >= lives;
    const node = h("span", { class: "h" + (broken ? " broken" : "") + (broken && shown.lives != null && i < shown.lives ? " breaking" : ""), title: !s ? "No call selected" : broken ? "Lost: an objection after price was not overcome" : "Heart" });
    node.append(svgFrom(ICON.heart.replace('fill="currentColor"', "")));
    hearts.append(node);
  }
  shown.lives = s ? lives : null;
  const pre = s ? s.objections.filter((o) => !o.afterPrice).length : 0;
  $("hearts-cap").textContent = s ? `${lives}/${limit} hearts${pre ? ` · ${pre} before price` : ""}` : "Hearts";
  $("hearts-cap").title = s ? `${plural(pre, "objection")} before price; those cost no heart` : "";

  const score = s?.score ?? 0;
  $("score").textContent = s ? score : "–";
  if (s && score > shown.score && !reduceMotion()) {
    const d = $("delta");
    d.textContent = `+${score - shown.score}`;
    d.classList.remove("go"); void d.offsetWidth; d.classList.add("go");
  }
  shown.score = score;
  paintClock(s);
}

function paintClock(s) {
  $("timer").textContent = s ? mmss(endOf(s) - s.startedAt).padStart(5, "0") : "–";
}

// Badges as an icon strip in the HUD: earned ones in gold, in the order they were won, then the
// ones still to win. The caption counts what was earned; it names no total the server doesn't send.
function paintBadges(s) {
  const earned = s?.badges ?? [];
  const list = [...earned, ...Object.keys(BADGE_ICONS).filter((b) => !earned.includes(b))];
  $("badges").replaceChildren(...list.map((b) => {
    const on = earned.includes(b);
    const el = h("span", { class: (on ? "earned" : "") + (on && !shown.badges.includes(b) && !reduceMotion() ? " pop" : ""), title: on ? `${b}: earned` : `${b}: not yet` });
    el.append(svgFrom(ICON.hex), h("i", {}, svgFrom(`<svg viewBox="0 0 24 24">${BADGE_ICONS[b] ?? BADGE_FALLBACK}</svg>`)));
    return el;
  }));
  const cap = $("badges-cap");
  cap.replaceChildren(s ? `${plural(earned.length, "badge")}` : "Badges", earned.length ? " · " : "", earned.length ? h("b", { text: earned.at(-1) }) : "");
  cap.title = s ? (earned.length ? `Earned: ${earned.join(", ")}` : "No badges yet") : "";
  shown.badges = [...earned];
}

// One toast at a time, inside the header over the badge strip: never over the status strip or the map.
// Every trigger is a real state change.
let toastTimer = 0;
function toast(kicker, text, icon, color) {
  if (reduceMotion()) return;
  const box = $("toasts");
  clearTimeout(toastTimer);
  fill(box, h("div", { class: "toast", "--tc": color }, h("span", { class: "ti" }, svgFrom(icon)), h("div", {}, h("small", { text: kicker }), h("b", { text }))));
  toastTimer = setTimeout(() => box.replaceChildren(), 3100);
}

function celebrate(prev, s) {
  if (!prev || prev.callId !== s.callId) return;
  // The event that ends the call turns the strip into the outcome banner, which already says it,
  // and an earlier toast still on screen (say "1 of 4 left") would contradict it.
  if (!prev.outcome && s.outcome) { clearTimeout(toastTimer); $("toasts").replaceChildren(); return; }
  const laneOf = (x) => Math.max(-1, ...x.trail.map((t) => FLOW.LANES.findIndex((l) => l.id === ST(t.stage).lane && l.id !== "exit")));
  const newBadge = s.badges.find((b) => !prev.badges.includes(b));
  if (prev.livesLeft > s.livesLeft) toast("Heart lost", `${s.livesLeft} of ${FLOW.OBJECTION_LIMIT} left`, ICON.heart, "#f43f5e");
  else if (newBadge) toast("Achievement unlocked", newBadge, ICON.hex.replace("<path", '<path fill="currentColor"'), "var(--gold)");
  else if (laneOf(s) > laneOf(prev) && !isTerm(s)) { const lane = FLOW.LANES[laneOf(s)]; toast("Lane reached", lane.label, ICON.map, LANE_COLOR[lane.id]); }
}

/* ================= status strip ================= */
// Main-path stages as lane-colored ticks. A side stage (such as Objection) gets a tick only once visited,
// so a clean close never shows an unlit step.
function seqRail(s) {
  const visited = new Set(s.trail.map((t) => t.stage));
  return h("div", { class: "seq", "aria-label": "Stage sequence" },
    FLOW.LANES.filter((l) => l.id !== "exit").map((l) => {
      const ids = ORDER.filter((id) => ST(id).lane === l.id && (MAIN.includes(id) || visited.has(id)));
      return h("div", { class: "seq-ticks", "--c": LANE_COLOR[l.id], title: l.label },
        ids.map((id) => h("i", { class: (MAIN.includes(id) ? "" : "side ") + (id === s.stage ? "cur" : visited.has(id) ? "on" : ""), title: ST(id).label })));
    }));
}

const mainCount = (s) => `${stagesReached(s)} of ${MAIN.length} main-path stages`;

function outcomeSub(s) {
  const from = ST(lastLive(s)).label, limit = FLOW.OBJECTION_LIMIT;
  // crmStatus is the status the reducer targets for this ending; the page can't see whether the sync landed.
  const crm = s.crmStatus ? `CRM target ${s.crmStatus}` : "No CRM status target";
  const lead = {
    won: `Reached ${ST(s.stage).label}`,
    lost: s.livesLeft === 0 ? `Out of hearts: ${limit} objections after price not overcome` : `Ended from ${from} with ${s.livesLeft} of ${limit} hearts left`,
    callback: `Last live stage: ${from}`,
    hangup: `Hung up during ${from}`,
    dnc: `Asked not to be called, during ${from}`,
    not_qualified: `Did not qualify at ${from}`,
    voicemail: "No live conversation", no_answer: "No live conversation",
  }[s.outcome] ?? `Ended from ${from}`;
  return [lead, crm, mainCount(s)].join("  ·  ");
}

function paintStatus(s) {
  const el = $("status");
  if (!s) {
    el.className = ""; el.style.removeProperty("--c");
    const waiting = currentId && !follow;
    fill(el, h("div", { class: "now" }, h("div", { class: "now-k", text: "Standing by" }), h("div", { class: "now-name", text: waiting ? "Waiting for call" : "No call yet" })),
      h("div", { class: "now-goal", text: waiting ? `Pinned to call ${currentId}. It shows here as soon as its first event arrives.` : "Start a call or a replay; this screen follows the newest call automatically." }));
    return;
  }
  if (s.outcome) {
    const cls = s.outcome === "won" ? "won" : BAD_END.has(s.outcome) ? "lost" : "neutral";
    const c = cls === "won" ? "var(--good)" : cls === "lost" ? "var(--bad)" : "var(--exit)";
    // The enter animation runs once, when the strip turns from a live stage into the banner.
    el.className = `end ${cls} enter`;
    el.style.setProperty("--c", c);
    const icon = cls === "won" ? ICON.check : cls === "lost" ? ICON.x : s.outcome === "callback" ? ICON.clock : ICON.phone;
    const cs = caseStrength(s);
    const post = s.objections.filter((o) => o.afterPrice);
    const all = Object.keys(FLOW.FACTS);
    const real = all.filter((k) => factState(s.facts, k) === "ok").length, ph = all.filter((k) => factState(s.facts, k) === "unk").length;
    const stat = (v, l, t) => h("div", { class: "stat", title: t }, h("b", { text: v }), h("small", { text: l }));
    const sub = outcomeSub(s);
    fill(el,
      h("div", { class: "out-icon" }, svgFrom(icon)),
      h("div", { class: "out-main" }, h("div", { class: "out-title", text: OUTCOME_TITLE[s.outcome] ?? cap(human(s.outcome)) }),
        h("div", { class: "out-sub", text: sub, title: `${sub}\nCRM target is the status the flow sets for this ending; this page doesn't see whether the CRM sync succeeded.` })),
      h("div", { class: "stats" },
        stat(mmss(endOf(s) - s.startedAt), "Duration"),
        stat(String(s.score), "Score"),
        stat(`${s.livesLeft}/${FLOW.OBJECTION_LIMIT}`, "Hearts"),
        stat(`${cs.n}/${cs.total}`, "Case", `${cs.tier.word}: needs facts with a real answer`),
        stat(post.length ? `${post.filter((o) => o.resolved === true).length}/${post.length}` : "–", "Obj. overcome", post.length ? "Objections after price that were overcome" : "No objection after price, so none to overcome"),
        stat(`${real}/${all.length}`, "Facts", `${real} real answers${ph ? ` + ${ph} placeholder${ph === 1 ? "" : "s"}` : ""} of ${all.length} facts`)),
      seqRail(s));
    return;
  }
  const st = ST(s.stage), stale = isStale(s);
  el.className = stale ? "stale" : "";
  el.style.setProperty("--c", stale ? "var(--warn)" : LANE_COLOR[st.lane]);
  const lane = FLOW.LANES.find((l) => l.id === st.lane);
  const md = moodOf(s);
  const moodPill = md.st === "none" ? h("span", { class: "mood none", text: "not reported", title: "No stage move has carried a mood yet" })
    : h("span", { class: `mood ${md.v}${md.st === "maybe" ? " maybe" : ""}`, text: md.st === "maybe" ? `${md.v}?` : md.v, title: md.st === "maybe" ? "Neutral is the starting value; no mood was seen since this page loaded" : "Sarah's read, set on a stage move" });
  fill(el,
    h("div", { class: "now" }, h("div", { class: "now-k" }, h("span", { text: stale ? "Stale?" : "Now" }), h("span", { class: "lane-tag", "--c": LANE_COLOR[st.lane], text: lane?.label ?? "" })), h("div", { class: "now-name", text: st.label })),
    h("div", { class: "now-goal" }, h("small", { text: "Stage goal" }), h("div", { class: "goal", text: st.goal ?? "", title: st.goal ?? "" }), whyLine(s)),
    stale ? h("div", { class: "st-stat", title: "No event for this long. The call may have dropped without call_ended." }, h("b", { class: "stale", text: ago(Date.now() - lastActivity(s)) }), h("small", { text: "No events" }))
      : h("div", { class: "st-stat" }, h("b", { id: "in-stage", text: mmss(endOf(s) - s.trail.at(-1).at) }), h("small", { text: "In stage" })),
    h("div", { class: "st-stat" }, moodPill, h("small", { text: "Sarah's read" })),
    seqRail(s));
}

// The prospect's why, pinned in the strip: the first of pain, why now and protecting with a real value.
// Quoted only when the words appear in a prospect line; otherwise shown as Sarah's note.
function whyLine(s) {
  const k = WORD_KEYS.map(([key]) => key).find((key) => factState(s.facts, key) === "ok");
  if (!k) {
    if (!s.trail.some((t) => CASE_STAGES.includes(t.stage))) return null;
    return h("div", { class: "why-line miss-why" }, h("span", { class: "wk", text: "Their why" }), h("span", { class: "nt", text: "not captured yet" }));
  }
  const v = String(s.facts[k]), said = saidAt(s, k);
  const label = WORD_KEYS.find(([key]) => key === k)[1];
  return h("div", { class: "why-line", title: `${label}: ${v}` }, h("span", { class: "wk", text: label === "The pain" ? "Their why" : label }),
    said ? h("q", { text: v }) : h("span", { class: "nt", text: v }), sourceTag(s, k));
}

/* ================= left column: what to do now ================= */
// Long values sit on their own line under the label instead of being cut off at 1366.
function checkRow(s, k) {
  const st = reqState(s, k);
  const v = k === "quote" ? (s.quote ? `${s.quote.options.length} options` : "missing")
    : st === "ok" ? String(s.facts[k]) : st === "unk" ? `saved as “${s.facts[k]}”: passes the gate, no real value` : "missing";
  return h("div", { class: `chk ${st}` + (st === "unk" || v.length > 24 ? " wide" : "") }, h("span", { class: "box" }), h("span", { text: reqLabel(k) }), h("span", { class: "v", text: v, title: v }));
}

function gateBlock(s, gate, ended) {
  const todo = gate.reqs.filter((k) => reqState(s, k) === "todo").length;
  const unk = gate.reqs.filter((k) => reqState(s, k) === "unk").length;
  const where = gate.steps === 1 ? "next" : `${gate.steps} ahead`;
  const status = todo ? `${todo} missing` : `open · ${unk} placeholder${unk === 1 ? "" : "s"}`;
  const head = ended ? (todo ? "Still missing for " : "Gate ") : todo ? "Unlock " : "Gate ";
  return h("div", { class: "nba-gate" },
    h("div", { class: "nba-gate-h" }, h("span", {}, head, h("b", { text: ST(gate.id).label })), h("span", { text: ended ? status : `${status} · ${where}` })),
    gate.reqs.map((k) => checkRow(s, k)));
}

function pathRow(s, from) {
  const stops = pathAhead(from);
  if (!stops.length) return null;
  return h("div", { class: "path lv1" }, h("span", { class: "k", text: "Path ahead" }),
    stops.map((id, i) => {
      const gated = gateReqs(id).length > 0, open = gated && gateOpen(s, id);
      const weak = open && gateReqs(id).some((k) => reqState(s, k) === "unk");
      return [i ? h("span", { class: "ar", text: "›" }) : null,
        h("span", { class: "stop" + (gated ? (weak ? " weak" : open ? " unlocked" : " locked") : ""), title: gated ? `Gate: ${gateReqs(id).map(reqLabel).join(", ")}${weak ? " (open on a placeholder)" : ""}` : "" }, gated ? svgFrom(open ? ICON.unlock : ICON.lock) : null, ST(id).label)];
    }));
}

function paintNba(s) {
  const box = $("nba"), meta = $("nba-meta");
  if (!s) { meta.textContent = ""; fill(box, empty("No call selected.")); return; }
  if (isTerm(s)) {
    meta.textContent = "call over";
    const won = ST(s.stage);
    if (s.outcome === "won") {
      fill(box, h("div", { class: "nba-goal", text: `${won.label} facts collected.` }),
        h("div", { class: "nba-gate" }, h("div", { class: "nba-gate-h" }, h("span", {}, "Collected for ", h("b", { text: won.label }))), gateReqs(s.stage).map((k) => checkRow(s, k))),
        has(s.facts, "address") ? h("div", { class: "lv1" }, checkRow(s, "address")) : null);
      return;
    }
    const from = lastLive(s);
    const last = from === "dialing" ? "Never got past Dialing." : `Last live stage: ${ST(from).label}.`;
    // Lost, DNC and not-qualified calls get no "unlock" checklist: there's no next stage to unlock.
    if (["lost", "dnc", "not_qualified"].includes(s.outcome)) {
      fill(box, h("div", { class: "nba-goal" }, `${OUTCOME_TITLE[s.outcome]}. `, h("span", { class: "soft", text: s.outcome === "dnc" ? `${last} No follow-up call.` : last })));
      return;
    }
    const gate = nextGate(s, from);
    fill(box,
      h("div", { class: "nba-goal" }, `${OUTCOME_TITLE[s.outcome] ?? cap(human(s.outcome))}. `, h("span", { class: "soft", text: last })),
      gate ? gateBlock(s, gate, true) : h("div", { class: "nba-gate" }, h("div", { class: "nba-gate-h" }, h("span", { text: "Every gate ahead was already clear." }))));
    return;
  }
  meta.textContent = "";
  const st = ST(s.stage);
  const open = openObjection(s);
  const kids = [];
  if (open) kids.push(h("div", { class: "nba-alert" }, h("span", { class: "ic", text: "!" }),
    h("div", {}, h("b", { text: `First, overcome: ${cap(human(open.kind))}` }),
      h("small", { text: `After price, at ${mmss(open.at - s.startedAt)}. Not overcome costs a heart.` }))));
  // The stage goal is also in the status strip, so the compact form leads with the gate checklist.
  kids.push(h("div", { class: "nba-goal lv1", text: st.goal ?? st.label }));
  if (selfLoop(s.stage) && s.objections.length) {
    const last = s.objections.at(-1), os = objStatus(last);
    kids.push(h("div", { class: "nba-ctx lv1" }, "Latest objection: ", h("b", { text: cap(human(last.kind)) }), " · ", h("span", { style: `color:${os.k};font-weight:700`, text: os.s })));
  }
  const gate = nextGate(s, s.stage);
  kids.push(gate ? gateBlock(s, gate) : h("div", { class: "nba-gate" }, h("div", { class: "nba-gate-h" }, h("span", { text: "Every gate ahead is already clear." }))));
  kids.push(pathRow(s, s.stage));
  fill(box, ...kids);
}

function paintRules(s) {
  const box = $("rules"), meta = $("rules-meta");
  if (!s) { fill(box, empty("Rules run once a call starts.")); meta.textContent = "rules"; meta.style.cssText = ""; return; }
  const rank = { alert: 0, flag: 1, nc: 2 };
  const rs = rules(s).map((r, i) => ({ ...r, i })).sort((a, b) => (rank[a.st] ?? 3) - (rank[b.st] ?? 3) || a.i - b.i);
  const hotOf = (r) => r.st === "alert" || r.st === "flag";
  const active = rs.filter(hotOf).length, passed = rs.filter((r) => r.st === "pass").length;
  const unchecked = rs.length - active - passed;
  // Green "all clear" only when every rule ran and passed; nothing applied reads neutral, not as a pass.
  const tone = active ? "warn" : passed === rs.length ? "good" : null;
  meta.textContent = active ? `${active} active · ${passed}/${rs.length} pass`
    : passed === rs.length ? `all clear · ${passed}/${rs.length} pass`
    : passed ? `${passed}/${rs.length} pass · ${unchecked} unchecked` : `${rs.length} not checked`;
  meta.style.color = tone ? `var(--${tone})` : "";
  meta.style.borderColor = tone ? `color-mix(in srgb, var(--${tone}) 45%, transparent)` : "";
  meta.title = "Rules are fixed thresholds over the call state, not judgments";
  const tag = { wait: "not yet", na: "n/a", nc: "can't check" };
  const rows = rs.map((r) => {
    const hot = hotOf(r) || r.st === "nc";
    return h("div", { class: `rule ${r.st}` + (hot ? "" : " lv2"), title: r.detail ?? "" },
      h("span", { class: "ic", text: r.st === "pass" ? "✓" : hotOf(r) ? "!" : r.st === "nc" ? "?" : "" }),
      h("div", {}, hot ? [h("b", { text: r.label }), r.detail ? h("small", { class: "lv1", text: r.detail }) : null] : r.label),
      h("span", { class: "tg", text: tag[r.st] ?? "" }));
  });
  // Compact forms: the rules that need attention (level 0 without their details), then one line
  // counting the rest. Level 2 lists every rule.
  const quiet = rs.filter((r) => !hotOf(r) && r.st !== "nc");
  const count = (st) => quiet.filter((r) => r.st === st).length;
  const sum = quiet.length ? h("div", { class: "rules-sum max1" },
    count("pass") ? h("span", {}, h("b", { text: `✓ ${count("pass")} passed` })) : null,
    count("wait") ? h("span", { text: `${count("wait")} not yet` }) : null,
    count("na") ? h("span", { text: `${count("na")} n/a` }) : null) : null;
  fill(box, ...rows, sum);
}

/* ================= center: transcript ================= */
function paintTalk(s) {
  const box = $("talk");
  if (!s || !s.transcript.length) { box.replaceChildren(); return; }
  const t = talk(s);
  const name = s.lead?.name ?? s.facts.first_name ?? "Prospect";
  // Below the rule's minimum a percentage would read as a verdict; show the raw counts instead.
  if (t.total < RULE.talkMinWords) {
    fill(box, h("span", { class: "few", title: `The ratio shows once the recent transcript has ${RULE.talkMinWords}+ words` },
      h("span", { class: "bt", text: `Sarah ${plural(t.bot, "word")}` }), " · ", h("span", { style: "color:var(--pro)", text: `${name} ${plural(t.pro, "word")}` }), ` · ratio after ${RULE.talkMinWords}+ words`));
    return;
  }
  const over = t.botPct > RULE.talkPct;
  fill(box,
    h("span", { class: "bt" }, "Sarah ", h("b", { text: t.total ? `${t.botPct}%` : "–", style: over ? "color:var(--warn)" : "" })),
    h("div", { class: "ratio", title: `${t.bot} words Sarah, ${t.pro} words ${name}, last ${t.lines} lines. The mark is the ${RULE.talkPct}% rule.` },
      h("div", { class: "a", style: `width:${t.botPct}%` }), h("div", { class: "b", style: `width:${t.total ? 100 - t.botPct : 0}%` }),
      h("span", { class: "ratio-mark", style: `left:${RULE.talkPct}%`, "data-l": `${RULE.talkPct}%` })),
    h("span", { class: "pr" }, h("b", { text: t.total ? `${100 - t.botPct}%` : "–" }), ` ${name}`),
    h("span", { class: "meta", style: "color:var(--muted)", text: `· recent ${t.lines} lines` }));
}

function paintTranscript(s) {
  paintTalk(s);
  const box = $("transcript");
  if (!s || !s.transcript.length) { fill(box, empty(s ? "No lines yet." : "No call selected.")); shown.trId = s?.callId ?? null; return; }
  const near = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  const name = String(s.lead?.name ?? s.facts.first_name ?? "Prospect");
  const needles = factNeedles(s);
  const tagged = new Set();
  const rows = s.transcript.map((l, i) => {
    const bot = l.speaker === "bot";
    const hl = bot ? { nodes: [l.text], keys: [] } : highlight(l.text, needles);
    const tags = hl.keys.filter((n) => !tagged.has(n.key) && tagged.add(n.key));
    return h("div", { class: `ln ${l.speaker}` + (i === s.transcript.length - 1 ? " last" : "") },
      h("div", { class: "who" }, h("span", { class: "av", text: bot ? "S" : name.charAt(0).toUpperCase() }),
        h("div", { class: "wt" }, h("b", { text: bot ? "Sarah" : name, title: bot ? "Sarah" : name }), h("time", { text: mmss(l.at - s.startedAt) }))),
      h("p", {}, hl.nodes, tags.map((n) => h("span", { class: "ftag" + (n.needs ? " needs" : ""), text: n.label }))));
  });
  fill(box, ...rows);
  if (near || shown.trId !== s.callId) box.scrollTop = box.scrollHeight;
  shown.trId = s.callId;
}

/* ================= right column: the case and the money ================= */
// Where a saved value came from: a prospect line that holds it word for word, or Sarah's own note.
// Nothing is claimed when there's no transcript, or when older lines may have rolled off.
function sourceTag(s, k) {
  if (isUnknown(s.facts[k])) return h("span", { class: "vb unk", text: `saved as “${s.facts[k]}”, no real value` });
  const line = saidAt(s, k);
  if (line) return h("span", { class: "vb said", text: `✓ said at ${mmss(line.at - s.startedAt)}`, title: line.remembered ? "Matched while the line was in the transcript; it has since rolled off" : "Found word for word in a prospect line" });
  if (!s.transcript.length) return h("span", { class: "vb note", text: "no transcript to check" });
  if (transcriptTrimmed(s)) return h("span", { class: "vb note", text: `can't check: transcript now starts at ${mmss(s.transcript[0].at - s.startedAt)}` });
  return h("span", { class: "vb note", text: "Sarah's note, not verbatim" });
}

function paintWords(s) {
  const box = $("words"), meta = $("words-meta");
  const f = s?.facts ?? {};
  const present = WORD_KEYS.filter(([k]) => has(f, k));
  if (!present.length) {
    meta.textContent = s ? "nothing saved yet" : "verbatim check";
    fill(box, h("div", { class: "empty lv1", text: "Nothing in the prospect's own words yet. Discovery saves the pain, why now and who they're protecting, so Sarah can play them back before any price." }));
    return;
  }
  const name = s.lead?.name ?? f.first_name ?? "Prospect";
  // Header summary by source: word for word, Sarah's note, or not checkable (no transcript, or lines
  // that rolled off before this page saw them).
  const real = present.filter(([k]) => !isUnknown(f[k]));
  const verbatim = real.filter(([k]) => saidAt(s, k)).length;
  const unchecked = !s.transcript.length || transcriptTrimmed(s) ? real.length - verbatim : 0;
  const notes = real.length - verbatim - unchecked;
  meta.textContent = [verbatim && `${verbatim} verbatim`, notes && plural(notes, "note"), unchecked && `${unchecked} can't check`].filter(Boolean).join(" · ") || "placeholders only";
  meta.title = "Saved pain, why now and protecting, checked word for word against the prospect's lines";
  const [lead, ...rest] = present;
  const leadVerb = saidAt(s, lead[0]);
  const kids = [
    h("div", { class: "lv1 quote" + (leadVerb ? "" : " note") }, leadVerb ? `“${f[lead[0]]}”` : String(f[lead[0]])),
    h("div", { class: "lv1 src" }, h("span", { text: `${name} · ${lead[1]}` }), sourceTag(s, lead[0])),
  ];
  if (rest.length) kids.push(h("div", { class: "why lv2" }, rest.map(([k, label]) => {
    const verb = saidAt(s, k);
    return h("div", {}, h("div", { class: "wl", text: label }), h("div", { class: "wv" + (verb ? "" : " note"), text: verb ? `“${f[k]}”` : String(f[k]) }), h("div", { class: "src" }, sourceTag(s, k)));
  })));
  if (!has(f, "pain") || isUnknown(f.pain)) kids.push(h("div", { class: "miss lv1", text: has(f, "pain") ? `The pain is saved as “${f.pain}”: not in their words yet` : "The pain is not captured yet" }));
  fill(box, ...kids);
}

function paintCase(s) {
  const box = $("case");
  if (!s) { fill(box, empty("No call selected.")); return; }
  const cs = caseStrength(s);
  const missing = cs.rows.filter((r) => r.st === "todo").map((r) => r.label);
  const unk = cs.rows.filter((r) => r.st === "unk");
  const confirmed = reqState(s, "case_confirmed");
  $("case-meta").textContent = "1 pt per real answer";
  $("case-meta").title = cs.tier.legend;
  const kids = [
    h("div", { class: "case-top", "--tc": cs.tier.c },
      h("div", { class: "case-n" }, String(cs.n), h("small", { text: `/${cs.total}` })),
      h("span", { class: "tier", text: cs.tier.word, title: cs.tier.legend }),
      h("div", { class: "confirm" }, "Case confirmed", h("b", { class: confirmed === "ok" ? "ok" : "", text: confirmed === "ok" ? "by prospect" : confirmed === "unk" ? "placeholder" : "not yet" }))),
    h("div", { class: "meter", "--tc": cs.tier.c, style: `grid-template-columns:repeat(${cs.total},1fr)` },
      cs.rows.map((r) => h("i", { class: r.st === "ok" ? "ok" : r.st === "unk" ? "unk" : "", title: `${r.label}: ${r.st === "todo" ? "not captured" : r.v}${r.st === "unk" ? " (placeholder, scores 0)" : ""}` }))),
    h("div", { class: "gaps lv2" },
      missing.length ? h("div", {}, "Gaps: ", h("b", { text: missing.join(", ") }))
        : h("div", { text: unk.length ? `No missing facts; ${plural(unk.length, "placeholder")}.` : "No gaps: every needs fact has a real answer." }),
      unk.length ? h("div", { class: "u" }, "Placeholder: ", h("b", { text: unk.map((r) => `${r.label} “${r.v}”`).join(", ") }), " passes the gate, no real value") : null),
    h("div", { class: "legend lv3", text: cs.tier.legend }),
  ];
  const d = discipline(s), echo = recapEcho(s), cp = caseAtPrice(s);
  const recap = d.quoteAt == null
    ? (d.recapAt ? ["ok", `${span(d.recapMs)} in ${ST("case_recap").label} · quote next`] : ["info", "not reached yet"])
    : d.recapAt != null && d.recapAt <= d.quoteAt ? ["ok", `${span(d.recapMs)} in ${ST("case_recap").label}`] : ["bad", "quoted before any recap"];
  const conf = confirmed === "ok" ? ["ok", String(s.facts.case_confirmed)] : confirmed === "unk" ? ["unk", `“${s.facts.case_confirmed}”`] : ["info", "not yet"];
  const atPrice = cp.st === "none" ? ["info", "price not shown yet"]
    : cp.st === "unseen" ? ["info", `not seen: page loaded after price (now ${cp.now.n}/${cp.now.total})`]
    : [cp.then.n < cp.thin ? "bad" : "ok", `${cp.then.n}/${cp.then.total} ${cp.then.tier.word}${cp.later.length ? ` · ${cp.later.length} filled after price` : ""}`];
  const row = (st, label, v) => h("div", { class: `chk ${st}` }, h("span", { class: "box" }), h("span", { text: label }), h("span", { class: "v", title: v, text: v }));
  // Long values sit on their own line under the label so nothing truncates at 1366.
  const wide = (st, label, v, extra) => h("div", { class: `chk wide ${st}` }, h("span", { class: "box" }), h("span", { text: label }), h("span", { class: "v" }, extra ?? null, v));
  const caseNames = CASE_STAGES.filter((id) => FLOW.STAGES[id]).map((id) => ST(id).label);
  const named = caseNames.length > 1 ? `${caseNames.slice(0, -1).join(", ")} and ${caseNames.at(-1)}` : caseNames.join("");
  kids.push(h("div", { class: "disc lv1" }, h("div", { class: "disc-h", text: "Discipline · from the stage trail" }),
    row(recap[0], "Recap before quote", recap[1]),
    row(conf[0], "Prospect confirmed", conf[1]),
    row(atPrice[0], "Case when price shown", atPrice[1]),
    wide("metric", d.priceAt ? "Case building before price" : "Case building so far", `${span(d.caseMs)} in ${named} · ${d.share}% of ${d.priceAt ? "pre-price" : "call"} time`, h("span", { class: "share" }, h("i", { style: `width:${d.share}%` }))),
    wide(echo.st, "Recap echoed their words", echo.v)));
  fill(box, ...kids);
}

function chosenIndex(s) {
  if (!has(s.facts, "chosen_option") || !s.quote) return -1;
  const txt = String(s.facts.chosen_option).replace(/,/g, "");
  let i = s.quote.options.findIndex((o) => txt.includes(Number(o.monthly).toFixed(2)));
  if (i < 0) i = s.quote.options.findIndex((o) => new RegExp(`\\b${o.face}\\b`).test(txt));
  return i;
}

// Before a quote exists, the ladder is a gate: the requires of the quote stage and the price stage.
function priceGateReqs() {
  const priceIds = Object.keys(FLOW.STAGES).filter((id) => (ST(id).requires ?? []).includes("quote"));
  const quoteIds = Object.keys(FLOW.STAGES).filter((id) => priceIds.some((p) => (ST(id).next ?? []).includes(p)));
  return [...new Set([...quoteIds, ...priceIds].flatMap((id) => ST(id).requires ?? []))];
}

function paintLadder(s) {
  const box = $("ladder");
  if (!s?.quote) {
    const reqs = priceGateReqs();
    const open = s && reqs.every((k) => reqState(s, k) !== "todo");
    const got = s ? reqs.filter((k) => reqState(s, k) === "ok").length : 0;
    $("lad-meta").textContent = s ? `locked · ${got}/${reqs.length} gate facts` : "locked";
    fill(box, h("div", { class: "locked lv1" },
      h("div", { class: "lk" + (open ? " open" : "") }, svgFrom(open ? ICON.unlock : ICON.lock)),
      h("div", {}, h("b", { text: "Prices locked" }), h("span", { text: "No price before the case is recapped and confirmed." }), s ? reqs.map((k) => checkRow(s, k)) : null)));
    return;
  }
  const opts = s.quote.options.map((o, i) => ({ ...o, i })).sort((a, b) => a.face - b.face);
  const max = Math.max(...opts.map((o) => o.monthly));
  const top = opts.find((o) => o.monthly === max);
  const ci = chosenIndex(s);
  const carriers = [...new Set(opts.map((o) => `${o.carrier} ${o.product}`))];
  const chosen = opts.find((o) => o.i === ci);
  $("lad-meta").textContent = `${plural(opts.length, "option")} · ${chosen ? `chose ${money(chosen.face)}` : s.pricePresented ? "presented" : "not presented yet"}`;
  $("lad-meta").title = `Tier ${String(s.quote.tier).toLowerCase()}`;
  const barTitle = `Bar length: monthly premium vs the highest option ($${Number(max).toFixed(2)}${top ? `, ${money(top.face)}` : ""})`;
  fill(box,
    h("div", { class: "lad-h lv1" }, h("b", { text: carriers.join(" / ") }), h("span", { text: "bar = monthly", title: barTitle })),
    ...opts.map((o) => h("div", { class: "rung lv1" + (o.i === ci ? " chosen" : "") },
      h("span", { class: "face", text: money(o.face) }),
      h("span", { class: "bar", title: barTitle }, h("i", { style: `width:${(o.monthly / max) * 100}%` })),
      h("span", { class: "m" }, `$${Number(o.monthly).toFixed(2)}`, h("small", { text: "/mo" })))),
    has(s.facts, "chosen_option") && ci < 0 ? h("div", { class: "empty lv1", style: "margin-top:.3rem", text: `Chosen: ${s.facts.chosen_option}` }) : null);
}

function paintTimeline(s) {
  const box = $("timeline");
  if (!s) { fill(box, empty("No call selected.")); $("tl-meta").textContent = ""; return; }
  const post = s.objections.filter((o) => o.afterPrice).length;
  const openNow = openObjection(s) && !isTerm(s);
  // The header is the card's compact form: objections first, the stage count when there are none.
  $("tl-meta").textContent = s.objections.length ? `${plural(s.objections.length, "objection")} · ${openNow ? "1 open" : `${post} after price`}` : `${stagesReached(s)}/${MAIN.length} main stages`;
  $("tl-meta").title = `${mainCount(s)} reached · ${plural(s.objections.length, "objection")}, ${post} after price`;
  const start = s.startedAt, end = endOf(s), dur = Math.max(1, end - start);
  const pct = (at) => `${Math.min(100, Math.max(0, ((at - start) / dur) * 100))}%`;
  const segs = s.trail.map((t, i) => {
    const to = s.trail[i + 1]?.at ?? end;
    const st = ST(t.stage);
    return h("div", { class: "seg" + (i === s.trail.length - 1 && !isTerm(s) ? " cur" : ""), "--c": BAD_END.has(t.stage) ? "var(--bad)" : LANE_COLOR[st.lane], style: `width:${((to - t.at) / dur) * 100}%`, title: `${st.label} · ${mmss(to - t.at)}` });
  });
  const priceAt = firstAt(s, "price");
  const objTrack = h("div", { class: "track obj" },
    s.objections.map((o) => { const st = objStatus(o); return h("i", { class: "om" + (o.afterPrice ? " post" : ""), "--k": st.k, style: `left:${pct(o.at)}`, title: `${cap(human(o.kind))} · ${st.s} · ${o.afterPrice ? "after price" : "before price, no heart"} · ${mmss(o.at - start)}` }); }));
  const exitO = exitObjection(s);
  // Each row: kind, status from o.resolved, time. Before price the reducer never settles an objection,
  // so an unsettled one there is tagged "before price" (no heart at stake), not given a verdict.
  const list = s.objections.length
    ? h("div", { class: "ol lv1" }, s.objections.map((o) => {
      const st = objStatus(o);
      return h("div", { class: "oi" + (o.afterPrice ? " post" : ""), "--k": st.k, title: `${cap(human(o.kind))} · ${o.afterPrice ? "after price" : "before price, no heart at stake"} · ${st.s}` },
        h("i"), h("span", { class: "k", text: cap(human(o.kind)) }), h("span", { class: "s", text: st.s }), h("span", { class: "at", text: mmss(o.at - start) }),
        o === exitO ? h("span", { class: "pre" }, "Last before the exit: ", h("em", { text: ST(s.stage).label })) : null);
    }))
    : h("div", { class: "empty lv1", style: "margin-top:.3rem", text: "No objections yet. Before price they cost no heart; after price each one not overcome costs a heart." });
  fill(box, h("div", { class: "tl lv2" },
    priceAt ? h("div", { class: "tl-over" }, h("div", { class: "price-line" + ((priceAt - start) / dur > 0.6 ? " flip" : ""), style: `left:${pct(priceAt)}` }, h("span", { text: "PRICE SHOWN" }))) : null,
    h("div", { class: "tl-row" }, h("span", { text: `Stages ${stagesReached(s)}/${MAIN.length}`, title: `${mainCount(s)} reached` }), h("div", { class: "track" }, segs)),
    h("div", { class: "tl-row" }, h("span", { text: "Objections" }), objTrack)),
    s.objections.length ? h("div", { class: "tl-legend lv2" }, h("span", {}, h("i"), "before price · no heart"), h("span", {}, h("i", { class: "f" }), "after price")) : null,
    list);
}

function paintFile(s) {
  const box = $("facts");
  const facts = s?.facts ?? {};
  const groups = {};
  for (const [key, f] of Object.entries(FLOW.FACTS)) (groups[f.group] ??= []).push([key, f]);
  // Counts are real answers only; a placeholder is counted separately, never as captured.
  let real = 0, ph = 0, all = 0;
  const stats = Object.entries(groups).map(([g, items]) => {
    const ok = items.filter(([k]) => factState(facts, k) === "ok").length, unk = items.filter(([k]) => factState(facts, k) === "unk").length;
    real += ok; ph += unk; all += items.length;
    return { g, items, ok, unk, full: ok === items.length };
  });
  const countTx = (x) => [`${x.ok}/${x.items.length}`, x.unk ? h("span", { class: "ph", text: ` +${x.unk}?`, title: `${x.unk} placeholder${x.unk === 1 ? "" : "s"}` }) : null];
  const chip = ([k, f]) => has(facts, k)
    ? h("span", { class: "f on" + (isUnknown(facts[k]) ? " unk" : ""), title: `${f.label}: ${facts[k]}${isUnknown(facts[k]) ? " (placeholder)" : ""}` }, `${f.label} `, h("b", { text: String(facts[k]) }))
    : h("span", { class: "f", text: f.label });
  const needs = stats.find((x) => x.g === "needs");
  fill(box,
    h("div", { class: "fcount max1" }, stats.map((x) => h("span", { class: x.full ? "full" : "" }, cap(x.g), h("b", {}, countTx(x))))),
    needs ? h("div", { class: "fneeds fx lv1 max1" }, needs.items.map(chip)) : null,
    ...stats.map((x) => h("div", { class: "fg lv2" },
      h("h3", {}, x.g, h("span", { class: x.full ? "full" : "" }, countTx(x))),
      h("div", { class: "fx" }, x.items.map(chip)))));
  $("facts-meta").textContent = s ? `${real}/${all} real${ph ? ` +${ph}?` : ""}` : "";
  $("facts-meta").title = s ? `${real} real answers${ph ? ` and ${plural(ph, "placeholder")} (saved, but no real value)` : ""} of ${all} facts` : "";
}

// Cards follow the call phase: the one that matters sits first, and it is the first to be given room.
function cardOrder(s) {
  if (!s) return ["words-card", "case-card", "ladder-card", "timeline-card"];
  const late = s.quote != null || ["present", "close"].includes(ST(s.stage).lane);
  if (isTerm(s)) return s.outcome === "won" ? ["ladder-card", "case-card", "timeline-card", "words-card"]
    : s.outcome === "lost" ? ["timeline-card", "case-card", "ladder-card", "words-card"]
    : s.objections.length ? ["case-card", "timeline-card", "words-card", "ladder-card"]
    : ["case-card", "words-card", "timeline-card", "ladder-card"];
  if (openObjection(s)) return ["timeline-card", "ladder-card", "case-card", "words-card"];
  if (late) return ["ladder-card", "case-card", "timeline-card", "words-card"];
  return ["words-card", "case-card", "ladder-card", "timeline-card"];
}

// Highest fit level per card (see the .lv classes): 0 is the compact form every card can always take.
const MAX_LEVEL = { "nba-card": 1, "rules-card": 2, "file-card": 2, "words-card": 2, "case-card": 3, "ladder-card": 1, "timeline-card": 2 };
// Left column upgrade order: what to do now, then every rule, then the prospect file.
const LEFT_STEPS = [["nba-card", 1], ["rules-card", 1], ["rules-card", 2], ["file-card", 1], ["file-card", 2]];
// Right column: one level at a time, round by round in phase order, so every card shows its
// essentials before any card shows its extras.
const roundRobin = (ids) => Array.from({ length: Math.max(...ids.map((id) => MAX_LEVEL[id])) }, (_, i) => ids.filter((id) => MAX_LEVEL[id] > i).map((id) => [id, i + 1])).flat();

// On a wallboard nobody scrolls. Start every side card compact, then raise levels step by step while
// the column still fits; a card that doesn't fit at a level stays below it. Only the transcript scrolls.
function fitColumns(s) {
  const order = cardOrder(s);
  order.forEach((id, i) => { $(id).style.order = i; });
  const stacked = matchMedia("(max-width: 1100px)").matches;
  for (const [col, steps] of [[$("left"), LEFT_STEPS], [$("right"), roundRobin(order)]]) {
    const ids = [...new Set(steps.map(([id]) => id))];
    for (const id of ids) $(id).dataset.level = stacked ? MAX_LEVEL[id] : 0;
    if (stacked) continue;
    const fits = () => col.scrollHeight <= col.clientHeight + 1;
    const stuck = new Set();
    for (const [id, l] of steps) {
      if (stuck.has(id)) continue;
      $(id).dataset.level = l;
      if (!fits()) { $(id).dataset.level = l - 1; stuck.add(id); }
    }
  }
}

/* ================= orchestration ================= */
function paintAll(s, animate) {
  if (s && shown.id !== s.callId) {
    resetBoard();
    shown = { id: s.callId, trailLen: 0, badges: [...s.badges], score: s.score, lives: s.livesLeft, trId: null };
    animate = false;
  }
  if (!s) { resetBoard(); shown = { id: null, trailLen: 0, badges: [], score: 0, lives: null, trId: null }; }
  shown.stale = s ? isStale(s) : false;
  $("direction").textContent = s?.lead?.source === "inbound" ? "inbound" : "outbound";
  if (s) paintBoard(s, animate);
  paintStatus(s); paintHud(s); paintNba(s); paintRules(s); paintBadges(s);
  paintTranscript(s); paintWords(s); paintCase(s); paintLadder(s); paintTimeline(s); paintFile(s);
  fitColumns(s);
}

// Once a second: what depends on the clock, follow hand-offs and calls going stale.
function tick() {
  followTick();
  paintPicker();
  const s = calls.get(currentId);
  paintClock(s);
  if (!s || isTerm(s)) return;
  if (isStale(s) !== shown.stale) { paintAll(s, false); return; }
  const el = $("in-stage");
  if (el) el.textContent = mmss(endOf(s) - s.trail.at(-1).at);
  paintNodeTimes(s); paintRules(s); paintTimeline(s); paintCase(s);
  fitColumns(s);
}

/* ================= picker, follow, deep link, theme, stream ================= */
const byNewest = (a, b) => b.startedAt - a.startedAt;
const newestId = () => [...calls.values()].sort(byNewest)[0]?.callId ?? null;
// Follow mode watches the newest call that is still live; a stale call doesn't count as live.
const newestLive = () => [...calls.values()].sort(byNewest).find((s) => !s.outcome && !isStale(s))?.callId ?? null;
const followTarget = () => newestLive() ?? newestId();

// The followed call ended: its banner stays up for FOLLOW_HOLD_MS, then the board moves to a call
// that is still live. With none live it stays put.
function followTick() {
  if (!follow) return;
  const cur = calls.get(currentId);
  if (cur && !cur.outcome && !isStale(cur)) return;
  if (cur && Date.now() < holdUntil) return;
  const target = newestLive() ?? (cur ? currentId : newestId());
  if (target && target !== currentId) show(target, false);
}

function syncUrl() {
  const u = new URL(location.href);
  if (follow || !currentId) u.searchParams.delete("call"); else u.searchParams.set("call", currentId);
  history.replaceState(null, "", u);
}

// Stage or outcome first, then the time, then the name: a long name is what gets cut, not the status.
function pickLabel(s) {
  const time = new Date(s.startedAt).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  const status = s.outcome ? OUTCOME_TITLE[s.outcome]?.split(" ·")[0] ?? human(s.outcome)
    : isStale(s) ? `No events ${ago(Date.now() - lastActivity(s))} · ${ST(s.stage)?.label ?? s.stage}` : ST(s.stage)?.label ?? s.stage;
  return `${status} · ${time} · ${s.lead?.name ?? s.callId}`;
}

let pickSig = "";
function paintPicker() {
  const pick = $("pick");
  const sorted = [...calls.values()].sort(byNewest);
  const opts = sorted.map((s) => [s.callId, pickLabel(s)]);
  if (currentId && !calls.has(currentId)) opts.unshift([currentId, `Waiting for ${currentId}`]);
  if (!opts.length) opts.push(["", "No calls yet"]);
  // Rebuild only when a label changed, so an open dropdown isn't reset every second.
  const sig = JSON.stringify([opts, currentId, follow]);
  if (sig === pickSig) return;
  pickSig = sig;
  pick.replaceChildren(...opts.map(([value, text]) => h("option", { value, text })));
  pick.value = currentId ?? "";
  $("follow").classList.toggle("on", follow);
  $("follow").textContent = follow ? "Following live" : "Follow live";
  $("follow").title = "Follows the newest live call. When it ends, its banner stays up a few seconds before moving on.";
}

function show(id, animate) {
  currentId = id;
  holdUntil = 0;
  paintPicker();
  syncUrl();
  paintAll(calls.get(id) ?? null, animate);
}

$("pick").addEventListener("change", (e) => { follow = e.target.value === followTarget(); show(e.target.value, false); });
$("follow").addEventListener("click", () => {
  follow = !follow;
  if (follow) show(followTarget(), false); else { paintPicker(); syncUrl(); }
});

function applyTheme(t) {
  if (t !== "light" && t !== "dark") return;
  document.documentElement.dataset.theme = t;
  $("theme").replaceChildren(svgFrom(t === "dark" ? ICON.sun : ICON.moon));
}
applyTheme("dark");
try { applyTheme(localStorage.getItem("mc-theme")); } catch {}
applyTheme(params.get("theme"));
$("theme").addEventListener("click", () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  applyTheme(next);
  try { localStorage.setItem("mc-theme", next); } catch {}
});

function connect() {
  const es = new EventSource("/stream");
  es.onopen = () => $("live").classList.add("on");
  es.onerror = () => $("live").classList.remove("on");
  es.onmessage = (m) => {
    const data = JSON.parse(m.data);
    if (data.snapshot) {
      // The snapshot is the server's whole set: calls it no longer has are dropped. Anything that
      // changed while the stream was down was not seen live, so those per-call observations reset.
      const ids = new Set(data.snapshot.map((s) => s.callId));
      for (const id of [...calls.keys()]) if (!ids.has(id)) calls.delete(id);
      for (const s of data.snapshot) {
        const old = calls.get(s.callId), w = seen.get(s.callId);
        if (w && (!old || old.transcript.length !== s.transcript.length || old.transcript.at(-1)?.at !== s.transcript.at(-1)?.at)) w.lines = null;
        if (w && w.mood === false && (!old || old.trail.length !== s.trail.length)) w.mood = null;
        calls.set(s.callId, s);
      }
      pickSig = "";
      show(follow ? followTarget() : currentId, false);
      return;
    }
    const prev = calls.get(data.callId);
    calls.set(data.callId, data.state);
    observe(prev, data.state, data.event);
    if (!prev && follow) { show(data.callId, false); return; }
    if (data.callId === currentId) {
      if (prev && !prev.outcome && data.state.outcome) holdUntil = Date.now() + FOLLOW_HOLD_MS;
      paintPicker();
      if (!prev) paintAll(data.state, false);
      else { celebrate(prev, data.state); paintAll(data.state, true); }
    } else paintPicker();
    followTick();
  };
}

function refit() { fitLabels(); fitColumns(calls.get(currentId) ?? null); }

(async () => {
  FLOW = await (await fetch("/flow")).json();
  ORDER = Object.keys(FLOW.STAGES).filter((id) => !isExit(id));
  MAIN = [];
  for (let id = ORDER[0]; id && !MAIN.includes(id); id = nextMain(id)) MAIN.push(id);
  board = buildBoard(FLOW);
  $("board").appendChild(board.svg);
  fitLabels();
  paintPicker();
  paintAll(null, false);
  setInterval(tick, 1000);
  addEventListener("resize", () => fitColumns(calls.get(currentId) ?? null));
  connect();
  // Web fonts last and non-blocking, after the load event so a hanging request can't hold it either:
  // offline or hanging, the page already runs on the system font stack.
  const addFont = () => {
    const font = h("link", { rel: "stylesheet", href: FONT_CSS });
    font.addEventListener("load", () => document.fonts?.ready.then(refit).catch(() => {}));
    document.head.append(font);
  };
  if (document.readyState === "complete") addFont(); else addEventListener("load", addFont, { once: true });
  document.fonts?.addEventListener?.("loadingdone", refit);
})();
</script>
</body>
</html>
